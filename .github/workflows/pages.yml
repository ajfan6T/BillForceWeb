# Checks every push to main and publishes the BILLFORCE website (website/, with the Windows
# download) to the gh-pages branch of the public ajfan6T/billforce-releases repository, served at
# https://billforce.in/ by GitHub Pages. Needs the secret RELEASES_TOKEN.
name: Test and publish the website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Windows app is built by desktop.yml; this job never needs Electron itself.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run lint
      - name: Tests (server engine)
        run: npm test
      - name: Tests (browser engine of the in-browser edition)
        run: npm run test:browser-engine
      - name: Build server edition
        run: npm run build
      - name: Build browser edition (check only, not published)
        run: npm run build:pages
      - name: Build the website
        run: npm run build:website
      - name: Publish the website (billforce.in)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Published to the public downloads repository (this one can be private), served at billforce.in.
          personal_token: ${{ secrets.RELEASES_TOKEN }}
          external_repository: ajfan6T/billforce-releases
          publish_dir: ./dist-website
          publish_branch: gh-pages
          # Replaces everything there before (the in-browser app is no longer published).
          force_orphan: true
          commit_message: 'Publish BILLFORCE website'

# Builds the Windows installer (Billforce-Setup.exe) on every push, installs and checks it on Windows,
# and for pushes to main publishes it, with the server edition (Billforce-Server.tar.gz), on the
# Releases page of the public downloads repository (the "publish" job below):
#   https://github.com/ajfan6T/billforce-releases/releases/latest/download/Billforce-Setup.exe
# A published release is never changed: its installer (and so its SHA-256) stays as it was first
# published. To publish a new installer, raise the version in package.json.
# Other branches keep the installer as a downloadable artifact of the run.
name: Windows app

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Build and test Billforce-Setup.exe
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Tests (on Windows)
        run: npm test
      - name: Build the app
        run: npm run build:desktop
      - name: Build the installer
        run: npx electron-builder --win --x64 --publish never
        env:
          # No code-signing certificate yet: do not look for one.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check the built app
        shell: pwsh
        run: ./scripts/smoke-test-windows.ps1 -Exe 'release\win-unpacked\BILLFORCE.exe' -Name unpacked
      - name: Install with Billforce-Setup.exe and check the installed app
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath 'release\Billforce-Setup.exe' -ArgumentList '/S' -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Billforce-Setup.exe failed (exit code $($setup.ExitCode))" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\BILLFORCE\BILLFORCE.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "BILLFORCE.exe was not installed at $exe" }
          $menu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\BILLFORCE.lnk'
          if (-not (Test-Path -LiteralPath $menu)) { throw "The Start menu shortcut is missing ($menu)" }
          ./scripts/smoke-test-windows.ps1 -Exe $exe -Name installed
      - name: Uninstall keeps the business data
        shell: pwsh
        run: |
          $data = Join-Path $env:APPDATA 'BILLFORCE\data'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          Set-Content -LiteralPath (Join-Path $data 'keep-me.txt') -Value 'business data'
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\BILLFORCE'
          Start-Process -FilePath (Join-Path $installDir 'Uninstall BILLFORCE.exe') -ArgumentList '/S' -Wait
          # The uninstaller hands over to a copy of itself: wait until the program is gone.
          for ($i = 0; $i -lt 60 -and (Test-Path -LiteralPath (Join-Path $installDir 'BILLFORCE.exe')); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path -LiteralPath (Join-Path $installDir 'BILLFORCE.exe')) { throw 'BILLFORCE was not uninstalled' }
          if (-not (Test-Path -LiteralPath (Join-Path $data 'keep-me.txt'))) { throw 'Uninstalling removed the business data' }
          Write-Host 'Uninstalled; the business data was kept.'
      - name: Uninstall with --delete-app-data --delete-backups removes the data and the backups
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath 'release\Billforce-Setup.exe' -ArgumentList '/S' -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Billforce-Setup.exe failed (exit code $($setup.ExitCode))" }
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\BILLFORCE'
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'BILLFORCE.exe'))) { throw 'BILLFORCE was not installed again' }
          $appData = Join-Path $env:APPDATA 'BILLFORCE'
          $backups = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'BILLFORCE Backups'
          if (-not (Test-Path -LiteralPath (Join-Path $appData 'data\keep-me.txt'))) { throw 'The data kept by the previous uninstall is missing' }
          New-Item -ItemType Directory -Force -Path (Join-Path $backups 'shop') | Out-Null
          Set-Content -LiteralPath (Join-Path $backups 'shop\old.bfbackup') -Value 'backup'
          Start-Process -FilePath (Join-Path $installDir 'Uninstall BILLFORCE.exe') -ArgumentList '/S', '--delete-app-data', '--delete-backups' -Wait
          for ($i = 0; $i -lt 60 -and ((Test-Path -LiteralPath $appData) -or (Test-Path -LiteralPath $backups) -or (Test-Path -LiteralPath (Join-Path $installDir 'BILLFORCE.exe'))); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path -LiteralPath (Join-Path $installDir 'BILLFORCE.exe')) { throw 'BILLFORCE was not uninstalled' }
          if (Test-Path -LiteralPath $appData) { throw "The business data was not deleted ($appData)" }
          if (Test-Path -LiteralPath $backups) { throw "The backups were not deleted ($backups)" }
          Write-Host 'Uninstalled with --delete-app-data --delete-backups; the data and the backups are gone.'
      - uses: actions/upload-artifact@v4
        with:
          name: Billforce-Setup
          path: release/Billforce-Setup.exe
          if-no-files-found: error

  publish:
    # Downloads are served from the public repository named in RELEASES_REPO (this repository can be
    # private). Needs the secret RELEASES_TOKEN: a token that can write to that repository's contents.
    name: Publish the release
    needs: installer
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASES_REPO: ajfan6T/billforce-releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: Billforce-Setup
          path: release
      - name: Copy earlier releases to the public repository (same files, same SHA-256)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          # Oldest first, so the newest copied release is the latest one there.
          for TAG in $(GH_TOKEN="$SOURCE_TOKEN" gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | .[].tagName'); do
            if gh release view "$TAG" --repo "$RELEASES_REPO" > /dev/null 2>&1; then continue; fi
            DIR="$RUNNER_TEMP/copy/$TAG"; mkdir -p "$DIR"
            # A release may have no files (only notes); it is copied all the same.
            GH_TOKEN="$SOURCE_TOKEN" gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$DIR" || echo "$TAG has no files to copy"
            GH_TOKEN="$SOURCE_TOKEN" gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$DIR.notes"
            TITLE=$(GH_TOKEN="$SOURCE_TOKEN" gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name --jq .name)
            FILES=$(find "$DIR" -type f)
            gh release create "$TAG" $FILES --repo "$RELEASES_REPO" --title "$TITLE" --notes-file "$DIR.notes"
            echo "Copied $TAG"
          done
      - name: Publish this version
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          npm ci --omit=dev
          npm run build
          npm run package:server
          if gh release view "$TAG" --repo "$RELEASES_REPO" > /dev/null 2>&1; then
            # A published installer is never replaced (its SHA-256 stays the same); the server
            # download is added if the release does not have it yet.
            if ! gh release view "$TAG" --repo "$RELEASES_REPO" --json assets --jq '.assets[].name' | grep -qx 'Billforce-Server.tar.gz'; then
              gh release upload "$TAG" release/Billforce-Server.tar.gz --repo "$RELEASES_REPO"
            fi
            echo "Release $TAG is already published; its installer is kept as it is. Raise the version in package.json to publish a new one."
          else
            gh release create "$TAG" release/Billforce-Setup.exe release/Billforce-Server.tar.gz --repo "$RELEASES_REPO" --title "BILLFORCE $VERSION" --notes-file .github/release-notes.md --latest
          fi
